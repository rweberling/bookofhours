<!-- Analytics, on earthlyhours.com only: a copy served anywhere else (a
     local test server, say) counts nothing.
     Cloudflare Web Analytics: cookieless page counts. Runs alongside the
     Google tag for now, to compare the two. (If the site is ever proxied
     through Cloudflare, turn off its automatic setup, or visits count twice.)
     Google tag (gtag.js); display_mode tells home-screen visits from browser ones. -->
<script>
  if (/(^|\.)earthlyhours\.com$/.test(location.hostname)) {
    [['https://static.cloudflareinsights.com/beacon.min.js', { cfBeacon: '{"token": "512cda5e961b4191b6f08cbcb80fc315"}' }],
     ['https://www.googletagmanager.com/gtag/js?id=G-P4407N365M', {}]].forEach(function (item) {
      var script = document.createElement('script');
      script.async = true; script.src = item[0];
      Object.keys(item[1]).forEach(function (key) { script.dataset[key] = item[1][key]; });
      document.head.appendChild(script);
    });
  }
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  // The site maker's own visits: opening any page with ?me marks this
  // browser (?notme unmarks it), and its visits go to Google Analytics as
  // internal traffic, which the Internal traffic data filter leaves out.
  // The mark is in localStorage, which Safari clears after about a week
  // away, as it does the analytics cookie.
  var gaSettings = {
    display_mode: (window.matchMedia('(display-mode: standalone)').matches
      || window.navigator.standalone === true) ? 'standalone' : 'browser'
  };
  try {
    var query = new URLSearchParams(location.search);
    if (query.has('me')) localStorage.setItem('earthlyhours-me', '1');
    if (query.has('notme')) localStorage.removeItem('earthlyhours-me');
    if (query.has('me') || query.has('notme')) {
      query.delete('me'); query.delete('notme');
      history.replaceState(history.state, '', location.pathname + (query.toString() ? '?' + query : '') + location.hash);
    }
    if (localStorage.getItem('earthlyhours-me') === '1') gaSettings.traffic_type = 'internal';
  } catch (e) {}
  gtag('config', 'G-P4407N365M', gaSettings);
</script>
