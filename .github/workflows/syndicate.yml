# Post the site's own content to Bluesky as earthlyhours.com
# (scripts/syndicate.py): each new Lectio Terra essay, with its
# standard.site record; Back in season on Tuesdays and Saturdays; and
# the hour, a keep card for one watch a day, posted in that watch
# (a stream with "dryRun" only writes what it would post to the run's
# summary; the hour's card is then kept with the run, under Artifacts).
# Runs daily at noon, every three hours for the hour, and after each
# push that changes the posts. Without the BLUESKY_APP_PASSWORD secret
# (Settings → Secrets and variables → Actions) it only says what it
# would post, in the run's summary. "Run workflow" by hand can also ask
# for a dry run.
#
# With the daily run (not the three-hourly hour runs), scripts/arena.py
# puts any new open-rights figures on Are.na, in the channels under The
# Earthly Book of Hours, and updates blocks whose records changed. Without
# the ARENA_TOKEN secret (an Are.na personal access token with write
# scope) it only says what it would do.
#
# Every run also moves the year's feed (year.xml, scripts/
# build_year_feed.py) on to today, Boston's date: the first run after
# midnight brings in the day's card or essay.
name: Syndicate

on:
  schedule:
    - cron: '7 17 * * *'          # about noon Eastern: every stream
    - cron: '23 */3 * * *'        # once in each watch, Boston time: the hour only
  push:
    branches: [main]
    paths: ['data/lectio-data.json']
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Only say what would be posted'
        type: boolean
        default: true

concurrency:
  group: syndicate
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  syndicate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Python packages (JPEG copies of the figures)
        run: pip install pillow==12.3.0

      - name: Which streams, and is the hour's card due
        id: plan
        run: |
          args=''
          [ "${{ github.event.schedule }}" = '23 */3 * * *' ] && args='--only hour'
          [ "${{ inputs.dry_run }}" = "true" ] && args="$args --dry-run"
          echo "args=$args" >> "$GITHUB_OUTPUT"
          echo "hour=$(python3 scripts/syndicate.py $args --hour-due)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v7
        if: steps.plan.outputs.hour == 'yes'
        with:
          node-version: '22'

      - name: Playwright and its Chromium (to draw the hour's card)
        if: steps.plan.outputs.hour == 'yes'
        run: |
          npm install --no-save --prefix "$RUNNER_TEMP/pw" playwright@1.63.0
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium
          echo "NODE_PATH=$RUNNER_TEMP/pw/node_modules" >> "$GITHUB_ENV"

      - name: Post what is due
        env:
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
          HOUR_CARD_DIR: ${{ runner.temp }}/hour-card
        run: python3 scripts/syndicate.py ${{ steps.plan.outputs.args }}

      - name: Are.na (new figures, and blocks whose records changed)
        if: ${{ !cancelled() && github.event.schedule != '23 */3 * * *' }}
        env:
          ARENA_TOKEN: ${{ secrets.ARENA_TOKEN }}
        run: python3 scripts/arena.py ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: The year's feed, for today (year.xml)
        if: ${{ !cancelled() }}
        run: python3 scripts/build_year_feed.py

      - name: Keep the hour's card with the run
        if: steps.plan.outputs.hour == 'yes'
        uses: actions/upload-artifact@v6
        with:
          name: hour-card
          path: ${{ runner.temp }}/hour-card/*.png
          if-no-files-found: ignore

      - name: Save what was posted, and the page's record link
        if: ${{ !cancelled() }}
        run: |
          git diff --quiet data/syndication.json year.xml && exit 0
          python3 scripts/build_lectio_pages.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/syndication.json year.xml lectio-terra/
          git commit -m "Syndication: Bluesky posts, Are.na blocks and the year's feed"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 5
          done
          exit 1
