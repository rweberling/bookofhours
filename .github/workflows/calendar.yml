# The calendar (scripts/build_calendar.py): calendar.ics at the root of
# the site, served by GitHub Pages at earthlyhours.com/calendar.ics.
# Rebuilt whenever the days, the posts or the records they name change,
# and committed if it changed (the same data gives the same file, so an
# unchanged calendar makes no commit). Also weekly, and by hand ("Run
# workflow"). No secrets: it uses the workflow's own token.
name: Calendar

on:
  push:
    branches: [main]
    paths:
      - 'data/days.json'
      - 'data/lectio-data.json'
      - 'data/readings.json'
      - 'data/images.json'
      - 'data/species.json'
      - 'data/phenomena.json'
      - 'data/syndication.json'
      - 'scripts/build_calendar.py'
  schedule:
    - cron: '41 9 * * 1'
  workflow_dispatch:

concurrency:
  group: calendar
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  calendar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Build the calendar and commit it if it changed
        run: |
          python3 scripts/build_calendar.py
          git add calendar.ics
          git diff --cached --quiet && { echo 'The calendar is unchanged.'; exit 0; }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Calendar: rebuilt from the data'
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 5
          done
          exit 1
